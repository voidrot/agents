[project]
name = "skill-eval"
version = "0.1.0"
description = "Portable multi-model evaluation and safe enhancement of agent skills"
authors = [
    { name = "Buck Brady", email = "22723438+voidrot@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "platformdirs>=4",
    "pydantic-ai>=1,<2",
    "pyyaml>=6",
    "sqlalchemy>=2",
    "typer>=0.16",
]

[project.scripts]
skill-eval = "skill_eval.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]
